<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scalesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="url(#bgGrad)" rx="16"/>

  <!-- Border accent line -->
  <rect width="600" height="200" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" rx="16" opacity="0.6"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="200" fill="url(#accentGrad)" rx="2"/>

  <!-- Circuit dots background pattern -->
  <circle cx="520" cy="30" r="2" fill="#00d4ff" opacity="0.15"/>
  <circle cx="545" cy="50" r="1.5" fill="#00d4ff" opacity="0.15"/>
  <circle cx="570" cy="25" r="2" fill="#7b2fff" opacity="0.15"/>
  <circle cx="560" cy="60" r="1.5" fill="#00d4ff" opacity="0.1"/>
  <circle cx="530" cy="75" r="1" fill="#7b2fff" opacity="0.15"/>
  <circle cx="580" cy="80" r="2" fill="#00d4ff" opacity="0.1"/>
  <circle cx="510" cy="160" r="1.5" fill="#7b2fff" opacity="0.12"/>
  <circle cx="550" cy="145" r="2" fill="#00d4ff" opacity="0.12"/>
  <circle cx="575" cy="165" r="1.5" fill="#7b2fff" opacity="0.1"/>
  <line x1="520" y1="30" x2="545" y2="50" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="545" y1="50" x2="560" y2="60" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="560" y1="60" x2="580" y2="80" stroke="#7b2fff" stroke-width="0.5" opacity="0.1"/>
  <line x1="550" y1="145" x2="575" y2="165" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>

  <!-- SCALES OF JUSTICE ICON (left side) -->
  <!-- Base pillar -->
  <rect x="88" y="145" width="4" height="35" fill="url(#scalesGrad)" rx="2" filter="url(#subtleGlow)"/>
  <!-- Base plate -->
  <rect x="68" y="178" width="44" height="5" fill="url(#scalesGrad)" rx="2.5" filter="url(#subtleGlow)"/>
  <!-- Top beam -->
  <rect x="56" y="87" width="68" height="4" fill="url(#scalesGrad)" rx="2" filter="url(#subtleGlow)"/>
  <!-- Center top knob -->
  <circle cx="90" cy="85" r="5" fill="url(#scalesGrad)" filter="url(#glow)"/>
  <!-- Pillar top to beam -->
  <rect x="88" y="89" width="4" height="58" fill="url(#scalesGrad)" rx="1" opacity="0.8"/>

  <!-- Left scale pan strings -->
  <line x1="60" y1="91" x2="50" y2="128" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
  <line x1="60" y1="91" x2="70" y2="128" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
  <!-- Left pan -->
  <path d="M 44 128 Q 60 136 76 128" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.9" filter="url(#subtleGlow)"/>

  <!-- Right scale pan strings -->
  <line x1="120" y1="91" x2="110" y2="122" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
  <line x1="120" y1="91" x2="130" y2="122" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
  <!-- Right pan (slightly lower - unbalanced, symbolizing AI intervention) -->
  <path d="M 104 122 Q 120 130 136 122" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.9" filter="url(#subtleGlow)"/>

  <!-- AI circuit nodes on scales -->
  <circle cx="60" cy="91" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="120" cy="91" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="90" cy="147" r="3" fill="#7b2fff" filter="url(#glow)"/>

  <!-- Shield outline behind scales -->
  <path d="M 90 42 L 130 58 L 130 95 Q 130 130 90 148 Q 50 130 50 95 L 50 58 Z"
        fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.2"/>

  <!-- TEXT SECTION -->
  <!-- AUTOJUSTICE -->
  <text x="175" y="105"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="2"
        fill="white"
        filter="url(#subtleGlow)">AUTO<tspan fill="url(#accentGrad)">JUSTICE</tspan></text>

  <!-- Thin separator line -->
  <rect x="175" y="115" width="340" height="1.5" fill="url(#accentGrad)" opacity="0.5" rx="1"/>

  <!-- AI :: NEXUS -->
  <text x="178" y="145"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="18"
        font-weight="300"
        letter-spacing="8"
        fill="#a0aec0">AI</text>

  <text x="222" y="145"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="18"
        font-weight="300"
        letter-spacing="2"
        fill="#4a5568">::</text>

  <text x="248" y="145"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="18"
        font-weight="700"
        letter-spacing="10"
        fill="url(#accentGrad)"
        filter="url(#subtleGlow)">NEXUS</text>

  <!-- Tagline -->
  <text x="178" y="168"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11"
        font-weight="300"
        letter-spacing="3"
        fill="#4a5568">AI-POWERED CYBERCRIME FIR AUTOMATION</text>
</svg>
